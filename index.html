<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شجرة عائلة الشيخ أبوالوفا الشرقاوي</title>

<style>
/* ====== SAME DESIGN (UNCHANGED) ====== */
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Segoe UI',Tahoma;
background:linear-gradient(135deg,#2c5aa0,#1e3c72);
min-height:100vh;padding:20px
}
.container{
max-width:1600px;margin:auto;
background:rgba(255,255,255,.95);
border-radius:20px;padding:30px
}
.header{
text-align:center;margin-bottom:30px;
background:linear-gradient(45deg,#1e3c72,#2a5298);
color:#fff;padding:25px;border-radius:15px
}
.tree{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
gap:20px
}
.family-unit{
background:#fff;border-radius:12px;padding:20px;
border:2px solid #ecf0f1;position:relative
}
.parents{display:flex;gap:8px;flex-wrap:wrap}
.parent{
background:linear-gradient(45deg,#2980b9,#1e3c72);
color:#fff;padding:6px 14px;border-radius:20px
}
.child{
background:linear-gradient(45deg,#3498db,#2980b9);
color:#fff;padding:5px 12px;border-radius:18px
}
.children{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.children-label{font-weight:bold;color:#2980b9;margin-top:10px}
.generation-badge{
position:absolute;top:10px;left:10px;
background:#1e3c72;color:#fff;
padding:4px 8px;border-radius:10px;font-size:.8em
}
.highlight{background:#f1c40f!important;color:#000}
.hidden{display:none}
.search-box{
width:100%;padding:12px;margin-bottom:20px;
border-radius:25px;border:2px solid #ccc;font-size:1.1em;text-align:center
}
</style>
</head>

<body>
<div class="container">
<div class="header">
<h1>شجرة عائلة الشيخ أبوالوفا الشرقاوي</h1>
</div>

<input id="searchBox" class="search-box" placeholder="ابحث عن اسم...">

<div class="tree" id="familyTree"></div>
</div>

<script>
/* ========= GOOGLE SHEETS CONFIG ========= */
const apiKey = 'AIzaSyBh82Bqe-FfnZdzjGSVwmrpdKiURhhHaZ4';
const sheetId = '1Vn9sSmLbbMvZ9lJO1HxhuU4v1Sjs7Hs7jOlZT2c-9ms';
const sheetName = 'Nagahamadi';

/* رابط Apps Script (للإضافة فقط) */
const webAppURL = 'https://script.google.com/macros/s/AKfycbw56WJPWn9F99mm6UtR_NqdF6WNdK-cC4KEJabD2m_UCdCfQ_BSrkAQiC61T0XUWr9pgA/exec';

/* ========= READ DATA ========= */
async function loadFamilyData(){
const url =
`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}?key=${apiKey}`;

const res = await fetch(url);
const data = await res.json();
const rows = data.values.slice(1); // skip header

return rows.map(r => ({
parents:[r[0],r[1]].filter(Boolean),
children: r[2] ? r[2].split(',').map(x=>x.trim()) : [],
generation: r[3] || ''
}));
}

/* ========= RENDER ========= */
async function renderFamilyTree(){
const families = await loadFamilyData();
const tree = document.getElementById('familyTree');
tree.innerHTML='';

families.forEach(f=>{
const box=document.createElement('div');
box.className='family-unit';

const gen=document.createElement('div');
gen.className='generation-badge';
gen.textContent='الجيل '+f.generation;
box.appendChild(gen);

const parents=document.createElement('div');
parents.className='parents';
f.parents.forEach(p=>{
const s=document.createElement('span');
s.className='parent'; s.textContent=p;
parents.appendChild(s);
});
box.appendChild(parents);

if(f.children.length){
const lbl=document.createElement('div');
lbl.className='children-label';
lbl.textContent='الأبناء:';
box.appendChild(lbl);

const ch=document.createElement('div');
ch.className='children';
f.children.forEach(c=>{
const s=document.createElement('span');
s.className='child'; s.textContent=c;
ch.appendChild(s);
});
box.appendChild(ch);
}
tree.appendChild(box);
});
}

/* ========= SEARCH ========= */
document.getElementById('searchBox').addEventListener('input',()=>{
const q=searchBox.value.trim().toLowerCase();
document.querySelectorAll('.family-unit').forEach(f=>{
let match=false;
f.querySelectorAll('.parent,.child').forEach(e=>{
e.classList.remove('highlight');
if(q && e.textContent.toLowerCase().includes(q)){
e.classList.add('highlight');
match=true;
}
});
f.classList.toggle('hidden',q && !match);
});
});

/* ========= ADD NEW FAMILY (OPTIONAL) ========= */
async function addFamily(parent1,parent2,children,generation){
await fetch(webAppURL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
parent1,parent2,
children:children.join(','),
generation
})
});
renderFamilyTree();
}

/* INIT */
renderFamilyTree();
</script>
</body>
</html>
